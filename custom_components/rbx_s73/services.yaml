compile_timelapse:
  name: Compile time-lapse
  description: >-
    Compile captured frames into a saved mp4. Give a single day, or a start and
    end date for a multi-day range. Defaults to today. Enable "Return response"
    to get the file location.
  target:
    entity:
      integration: rbx_s73
      domain: switch
  fields:
    start_date:
      name: Start date
      description: First day to include (defaults to today).
      selector:
        date:
    end_date:
      name: End date
      description: Last day to include (defaults to the start date = single day).
      selector:
        date:

export_timelapse:
  name: Export time-lapse (range)
  description: >-
    Compile the frames captured between two date-times into a temporary mp4
    (auto-deleted after a few hours). Returns the file location; browse it under
    Media. Enable "Return response" to see the path.
  target:
    entity:
      integration: rbx_s73
      domain: switch
  fields:
    start:
      name: Start
      description: Range start (local time).
      required: true
      selector:
        datetime:
    end:
      name: End
      description: Range end (local time).
      required: true
      selector:
        datetime:
